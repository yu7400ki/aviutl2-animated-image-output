[workspace]
members = ["libs/*", "plugins/*"]
default-members = ["plugins/*"]
resolver = "3"

[workspace.dependencies]
windows = { version = "0.62" }
widestring = { version = "1.2" }
rust-ini = { version = "0.21" }
win32-ui = { git = "https://github.com/yu7400ki/win32-ui", rev = "fbadbaf" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
