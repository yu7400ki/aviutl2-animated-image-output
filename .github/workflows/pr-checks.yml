name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust-changed: ${{ steps.changes.outputs.rust_any_changed }}
      frontend-changed: ${{ steps.changes.outputs.frontend_any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get changed files
        id: changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'aviutl2.toml'
              - 'packaging/**'
              - 'scripts/**'
              - 'about.toml'
              - 'about.hbs'
            frontend:
              - '**/*.{ts,tsx,js,jsx,json,html,css,md}'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'oxlint.config.ts'
              - '.oxfmtrc.json'
              - '.editorconfig'

  rust-checks:
    name: Rust Checks
    runs-on: windows-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.rust-changed == 'true'
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: D:\t

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch vendored sources
        uses: ./.github/actions/vendor

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check version consistency
        run: bash scripts/check-version.sh

      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $GITHUB_PATH

      - name: Install FFmpeg
        run: choco install ffmpeg -y

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check Build
        run: cargo build --locked

      - name: Run tests
        run: cargo test --workspace --locked

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Check format
        run: pnpm format:check

      - name: Run tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build
