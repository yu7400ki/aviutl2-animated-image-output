name: Build and Draft Release for Plugin

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch vendored sources
        uses: ./.github/actions/vendor

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check version consistency
        run: |
          VERSION="$(bash scripts/check-version.sh "$GITHUB_REF_NAME")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"

      - name: Install packaging tools
        run: |
          cargo install aviutl2-cli --version 0.11.0 --locked
          cargo install cargo-about --version 0.8.4 --locked

      - name: Collect third-party licences
        run: bash scripts/third-party-licences.sh

      # 6 本は .aviutl2-cli/release-stage/ を共有するので逐次で回す。
      # 全部入りが release ビルドを済ませ、形式ごとの 5 本は空振りする。
      - name: Build packages
        run: |
          for config in bundle png gif webp avif jxl; do
            au2 release -c "packaging/$config.toml" --set-version "$VERSION"
          done

      - name: Check packages
        run: bash scripts/check-packages.sh "$VERSION"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: release/*.au2pkg.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
