<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 80px;
        background: #ffffff;
        color: #111827;
        font-family:
          "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "BIZ UDPGothic", "Meiryo",
          sans-serif;
      }

      h1 {
        font-size: 64px;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: 0.01em;
      }

      p {
        margin-top: 24px;
        font-size: 30px;
        color: #4b5563;
      }

      ul {
        display: flex;
        gap: 16px;
        margin-top: 56px;
        padding: 0;
        list-style: none;
      }

      li {
        padding: 10px 26px;
        border-radius: 10px;
        border: 2px solid;
        font-size: 28px;
        font-weight: 700;
      }

      .png {
        background: #dcfce7;
        border-color: #86efac;
        color: #166534;
      }

      .gif {
        background: #dbeafe;
        border-color: #93c5fd;
        color: #1e40af;
      }

      .webp {
        background: #f3e8ff;
        border-color: #d8b4fe;
        color: #6b21a8;
      }

      .avif {
        background: #ffedd5;
        border-color: #fdba74;
        color: #9a3412;
      }

      .jxl {
        background: #ffe4e6;
        border-color: #fda4af;
        color: #9f1239;
      }
    </style>
  </head>
  <body>
    <h1>AviUtl2<br />アニメーション画像出力プラグイン</h1>
    <p>AviUtl ExEdit2で動画をアニメーション画像として出力するプラグインセット</p>
    <ul>
      <li class="png">PNG</li>
      <li class="gif">GIF</li>
      <li class="webp">WebP</li>
      <li class="avif">AVIF</li>
      <li class="jxl">JXL</li>
    </ul>
  </body>
</html>
