[package]
name = "gif_output"
version = "1.1.3"
edition = "2024"

[lib]
name = "gif_output"
crate-type = ["cdylib"]

[dependencies]
aviutl2 = { path = "../../libs/aviutl2" }
gif_encoder = { path = "../../libs/gif-encoder" }
win32_dialog = { path = "../../libs/dialog" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
